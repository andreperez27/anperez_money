name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # As chaves reais vivem em secrets do repositório (Settings ->
      # Secrets and variables -> Actions). O .env.local nunca sobe para o
      # GitHub; sem estas duas variáveis no build, o app online não sabe
      # qual projeto Supabase usar.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # GitHub Pages não tem fallback para rotas do React Router: um
      # refresh em /anperez_money/contas devolveria 404. Copiar o
      # index.html como 404.html faz o Pages servir o app nesses casos e o
      # router assume a rota correta.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Deploy para gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist